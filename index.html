<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>タイムカード | Mitsume Coffee</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
  :root{
    --green:#0A5A0B; --yellow:#FFED00; --olive:#836312;
    --ink:#243024; --muted:#6b726b; --line:#e3e0d2; --bg:#f7f4e9;
    --blue:#2b6cb0;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{margin:0; font-family:-apple-system,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif; background:var(--bg); color:var(--ink);}
  header{background:#fff; border-bottom:1px solid var(--line); padding:8px 12px; text-align:center; position:relative;}
  header a{display:inline-block;}
  header img{height:42px; display:block; margin:0 auto;}
  .head-btns{position:absolute; right:10px; top:50%; transform:translateY(-50%); display:flex; gap:8px;}
  .icon-btn{width:40px; height:40px; border-radius:50%; border:none; background:var(--green); color:#fff; font-size:19px; line-height:40px; text-align:center; cursor:pointer; padding:0;}
  main{max-width:560px; margin:0 auto; padding:16px 14px 40px;}
  .date{font-size:19px; font-weight:700; margin:6px 2px 2px;}
  .greet{font-size:16px; margin:0 2px 16px;}
  .msg{display:none; border-radius:10px; padding:10px 12px; font-size:14px; margin-bottom:12px;}
  .msg.err{display:block; background:#fdecec; color:#a11; border:1px solid #f2b8b8;}
  .msg.ok{display:block; background:#e9f7e9; color:var(--green); border:1px solid #bfe0bf;}
  .punch-area{display:flex; flex-direction:column; gap:14px;}
  .punch{border:none; border-radius:18px; padding:22px 16px 14px; cursor:pointer; text-align:center; width:100%;
    background:#fff; border:2px solid var(--line); color:var(--muted);}
  .punch .big{font-size:34px; font-weight:800; letter-spacing:.1em; display:block;}
  .punch .sub{font-size:14px; display:block; margin-top:8px; min-height:20px;}
  .punch.active-in{background:var(--blue); border-color:var(--blue); color:#fff; box-shadow:0 4px 14px rgba(43,108,176,.35);}
  .punch.active-out{background:var(--green); border-color:var(--green); color:#fff; box-shadow:0 4px 14px rgba(10,90,11,.3);}
  .punch:disabled{opacity:.55; cursor:default; box-shadow:none;}
  /* モーダル */
  .overlay{display:none; position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:30; align-items:center; justify-content:center; padding:18px;}
  .overlay.open{display:flex;}
  .sheet{background:#fff; border-radius:16px; padding:18px 16px; width:100%; max-width:420px; max-height:85vh; overflow:auto;}
  .sheet h3{margin:0 0 12px; font-size:16px; text-align:center;}
  .brk-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:8px;}
  .brk-grid button{padding:12px 0; font-size:15px; border-radius:999px; border:1px solid var(--line); background:#eef4fb; cursor:pointer;}
  .brk-grid button:active{background:var(--blue); color:#fff;}
  .cancel-btn{margin-top:14px; width:100%; padding:12px; border-radius:10px; border:1px solid var(--line); background:#fff; font-size:15px; cursor:pointer;}
  /* 一覧・編集 */
  .view{display:none;}
  .view.open{display:block;}
  table{width:100%; border-collapse:collapse; background:#fff; border-radius:12px; overflow:hidden; font-size:14px;}
  th,td{padding:9px 6px; border-bottom:1px solid var(--line); text-align:center;}
  th{background:var(--green); color:#fff; font-weight:600;}
  tr.tappable{cursor:pointer;}
  tr.today td{background:#fffbe0;}
  .total-line{text-align:right; font-weight:700; margin-top:10px; font-size:15px;}
  .back-btn{margin-bottom:12px; background:#fff; border:1px solid var(--line); border-radius:999px; padding:8px 16px; font-size:14px; cursor:pointer;}
  .month-nav{display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:10px;}
  .month-nav .date{margin:0; font-size:17px;}
  .month-nav .back-btn{margin-bottom:0; white-space:nowrap;}
  .field{margin-bottom:14px;}
  .field label{display:block; font-size:13px; color:var(--muted); margin-bottom:6px;}
  .field input,.field select{width:100%; padding:12px; font-size:17px; border:1px solid var(--line); border-radius:10px; background:#fff;}
  .save-btn{width:100%; padding:14px; border:none; border-radius:12px; background:var(--green); color:#fff; font-size:17px; font-weight:700; cursor:pointer;}
  .del-btn{width:100%; padding:12px; margin-top:10px; border:1px solid #d66; border-radius:12px; background:#fff; color:#b33; font-size:15px; cursor:pointer;}
  .del-btn.armed{background:#b33; color:#fff;}
  .loading{text-align:center; color:var(--muted); padding:30px 0; font-size:14px;}
</style>
</head>
<body>
<header>
  <a href="https://mitsume-coffee.github.io/shift-liff/portal/"><img src="Logo三ツ目2nd完成透過.png" alt="三ツ目珈琲 MITSUME COFFEE"></a>
  <div class="head-btns">
    <button class="icon-btn" id="btnList" title="今月の一覧">📋</button>
    <button class="icon-btn" id="btnEdit" title="今日の記録を編集">✏️</button>
  </div>
</header>

<main>
  <!-- 打刻ビュー -->
  <section id="viewPunch" class="view open">
    <div class="date" id="dateLabel"></div>
    <p class="greet" id="greet"></p>
    <div class="msg" id="msg"></div>
    <div class="punch-area">
      <div>
        <button class="punch" id="btnIn">
          <span class="big">出社</span>
          <span class="sub" id="inSub"></span>
        </button>
      </div>
      <div>
        <button class="punch" id="btnOut">
          <span class="big">退社</span>
          <span class="sub" id="outSub"></span>
        </button>
      </div>
    </div>
    <p class="loading" id="loading">読み込み中…</p>
  </section>

  <!-- 一覧ビュー -->
  <section id="viewList" class="view">
    <button class="back-btn" data-back>← 打刻にもどる</button>
    <div class="month-nav">
      <button class="back-btn" id="btnPrevMonth">← 前月</button>
      <div class="date" id="listTitle"></div>
      <button class="back-btn" id="btnNextMonth">次月 →</button>
    </div>
    <div class="msg" id="listMsg"></div>
    <table>
      <thead><tr><th>日付</th><th>出勤</th><th>退勤</th><th>休憩</th><th>勤務</th></tr></thead>
      <tbody id="listBody"></tbody>
    </table>
    <div class="total-line" id="listTotal"></div>
    <p style="font-size:12px;color:var(--muted)">行をタップすると、その日の記録を編集できます。</p>
  </section>

  <!-- 編集ビュー -->
  <section id="viewEdit" class="view">
    <button class="back-btn" data-back>← もどる</button>
    <div class="date" id="editTitle"></div>
    <p id="editRaw" style="font-size:13px;color:var(--muted);margin:0 2px 12px;"></p>
    <div class="msg" id="editMsg"></div>
    <div class="field"><label>出社</label><input type="time" id="editIn"></div>
    <div class="field"><label>退社</label><input type="time" id="editOut"></div>
    <div class="field"><label>休憩（分）</label><select id="editBreak"></select></div>
    <div class="field"><label>休暇</label>
      <select id="editLeave">
        <option value="">なし</option>
        <option value="年休">年休</option>
        <option value="半休">半休</option>
        <option value="忌引">忌引</option>
        <option value="欠勤">欠勤</option>
        <option value="他種">他種</option>
      </select>
    </div>
    <button class="save-btn" id="btnSaveEdit">保存する</button>
    <button class="del-btn" id="btnDelete">この日の記録を削除</button>
  </section>
</main>

<!-- 休憩選択モーダル -->
<div class="overlay" id="brkOverlay">
  <div class="sheet">
    <h3>休憩時間を登録して下さい</h3>
    <div class="brk-grid" id="brkGrid"></div>
    <button class="cancel-btn" id="brkCancel">やめる</button>
  </div>
</div>

<script>
const LIFF_ID = '2012734423-JWdExkSG';
const API_URL = 'https://script.google.com/macros/s/AKfycbwfi7HB_aq0yTKIQyCEofiDXIB3xRxnXC3dCzOO6_iWmdypGeMuNDREvH8JBvo7YXmU/exec';

let idToken = '', myName = '';
let state = null;         // getStatus の結果
let editDate = '', editBack = 'punch';

function showMsg(text, ok){
  const m = document.getElementById('msg');
  m.textContent = text || '';
  m.className = 'msg' + (text ? (ok ? ' ok' : ' err') : '');
}
function showEditMsg(text, ok){
  const m = document.getElementById('editMsg');
  m.textContent = text || '';
  m.className = 'msg' + (text ? (ok ? ' ok' : ' err') : '');
}
function showListMsg(text, ok){
  const m = document.getElementById('listMsg');
  m.textContent = text || '';
  m.className = 'msg' + (text ? (ok ? ' ok' : ' err') : '');
}

function jsonp(params){
  return new Promise(function(resolve, reject){
    const cb = 'cb_' + Date.now() + '_' + Math.floor(Math.random()*1e6);
    const script = document.createElement('script');
    const qs = Object.assign({}, params, { api:'1', callback: cb });
    script.src = API_URL + '?' + Object.keys(qs).map(function(k){
      return encodeURIComponent(k) + '=' + encodeURIComponent(qs[k]);
    }).join('&');
    window[cb] = function(res){ cleanup(); resolve(res); };
    script.onerror = function(){ cleanup(); reject(new Error('通信に失敗しました')); };
    function cleanup(){ delete window[cb]; script.remove(); }
    document.body.appendChild(script);
  });
}

async function api(action, extra){
  const params = Object.assign({ action: action, idToken: idToken, name: myName }, extra || {});
  const res = await jsonp(params);
  if (!res.ok) throw new Error(res.error || 'エラーが発生しました');
  return res.data;
}

function fmtH(min){ return (Math.round(min/6)/10).toFixed(1); }

function render(){
  if (!state) return;
  document.getElementById('loading').style.display = 'none';
  document.getElementById('dateLabel').textContent = state.dateLabel;
  const rec = state.record;
  const greet = document.getElementById('greet');
  if (rec.leave) greet.textContent = state.name + 'さん、今日は' + rec.leave + 'です';
  else if (rec.outTime) greet.textContent = state.name + 'さん、お疲れ様でした！';
  else greet.textContent = state.name + 'さん、おはようございます！';

  const btnIn = document.getElementById('btnIn');
  const btnOut = document.getElementById('btnOut');
  btnIn.disabled = !state.canIn;
  btnOut.disabled = !state.canOut;
  btnIn.className = 'punch' + (state.canIn ? ' active-in' : '');
  btnOut.className = 'punch' + (state.canOut ? ' active-out' : '');
  document.getElementById('inSub').textContent = rec.inTime ? rec.inTime : '';
  document.getElementById('outSub').textContent = rec.outTime ? (rec.outTime + '（休憩 ' + rec.breakMin + '分）') : '';
}

function getPosition(){
  return new Promise(function(resolve, reject){
    if (!navigator.geolocation) { reject(new Error('この端末では位置情報が使えません')); return; }
    navigator.geolocation.getCurrentPosition(
      function(pos){ resolve(pos); },
      function(err){ reject(new Error('位置情報が取れませんでした。位置情報を許可して、もう一度お試しください。')); },
      { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 }
    );
  });
}

async function doPunch(kind, breakMin){
  showMsg('位置情報を確認しています…', true);
  try {
    const pos = await getPosition();
    const payload = { kind: kind, lat: pos.coords.latitude, lng: pos.coords.longitude, acc: Math.round(pos.coords.accuracy || 0) };
    if (kind === 'out') payload.breakMin = breakMin;
    const data = await api('punch', { payload: JSON.stringify(payload) });
    state.record = data.record; state.canIn = data.canIn; state.canOut = data.canOut;
    showMsg(kind === 'in' ? ('出社 ' + data.time + ' を記録しました') : ('退社 ' + data.time + ' を記録しました。お疲れ様でした！'), true);
    render();
  } catch (e) {
    showMsg(e.message, false);
  }
}

/* 休憩グリッド（6分刻み 0〜120分） */
(function buildBreakGrid(){
  const grid = document.getElementById('brkGrid');
  for (let m = 0; m <= 120; m += 6) {
    const b = document.createElement('button');
    b.textContent = m + '分';
    b.addEventListener('click', function(){
      document.getElementById('brkOverlay').classList.remove('open');
      doPunch('out', m);
    });
    grid.appendChild(b);
  }
  const sel = document.getElementById('editBreak');
  for (let m = 0; m <= 120; m += 6) {
    const o = document.createElement('option');
    o.value = m; o.textContent = m + '分';
    sel.appendChild(o);
  }
})();

document.getElementById('btnIn').addEventListener('click', function(){ doPunch('in'); });
document.getElementById('btnOut').addEventListener('click', function(){
  document.getElementById('brkOverlay').classList.add('open');
});
document.getElementById('brkCancel').addEventListener('click', function(){
  document.getElementById('brkOverlay').classList.remove('open');
});
/* ビュー切替 */
function showView(id){
  ['viewPunch','viewList','viewEdit'].forEach(function(v){
    document.getElementById(v).classList.toggle('open', v === id);
  });
}
document.querySelectorAll('[data-back]').forEach(function(b){
  b.addEventListener('click', function(){ showView(editBack === 'list' && document.getElementById('viewEdit').classList.contains('open') ? 'viewList' : 'viewPunch'); editBack='punch'; });
});

/* 一覧 */
let listMonth = '';
async function loadList(ym){
  const data = await api('getMonth', ym ? { month: ym } : {});
  listMonth = data.month;
  document.getElementById('listTitle').textContent = data.month.replace('-', '年') + '月の一覧';
  const tb = document.getElementById('listBody');
  tb.innerHTML = '';
  data.days.forEach(function(d){
    const tr = document.createElement('tr');
    tr.className = 'tappable' + (state && d.date === state.date ? ' today' : '');
    const cells = [
      d.day + ' (' + d.dow + ')',
      (d.inTime || d.leave || ''),
      d.outTime || '',
      d.inTime && d.outTime ? d.breakMin + '分' : '',
      d.workMin !== null ? fmtH(d.workMin) + 'h' : ''
    ];
    cells.forEach(function(c, idx){
      const td = document.createElement('td');
      td.textContent = c;
      const raw = idx === 1 ? d.rawIn : (idx === 2 ? d.rawOut : '');
      const eff = idx === 1 ? d.inTime : (idx === 2 ? d.outTime : '');
      if (raw && eff && raw !== eff) {
        const sub = document.createElement('div');
        sub.style.cssText = 'font-size:11px;color:var(--muted)';
        sub.textContent = '打刻 ' + raw;
        td.appendChild(sub);
      }
      tr.appendChild(td);
    });
    tr.addEventListener('click', function(){ openEdit(d); });
    tb.appendChild(tr);
  });
  document.getElementById('listTotal').textContent = '合計 ' + fmtH(data.totalWorkMin) + ' 時間';
  showListMsg('');
  showView('viewList');
}
document.getElementById('btnList').addEventListener('click', async function(){
  try { await loadList(''); } catch (e) { showMsg(e.message, false); }
});
function shiftMonth(delta){
  if (!listMonth) return;
  const parts = listMonth.split('-');
  const d = new Date(Number(parts[0]), Number(parts[1]) - 1 + delta, 1);
  const ym = d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2);
  loadList(ym).catch(function(e){ showListMsg(e.message, false); });
}
document.getElementById('btnPrevMonth').addEventListener('click', function(){ shiftMonth(-1); });
document.getElementById('btnNextMonth').addEventListener('click', function(){ shiftMonth(1); });

/* 編集 */
function openEdit(d){
  editDate = d.date;
  editBack = document.getElementById('viewList').classList.contains('open') ? 'list' : 'punch';
  document.getElementById('editTitle').textContent = d.date + ' の修正';
  document.getElementById('editIn').value = d.inTime || '';
  document.getElementById('editOut').value = d.outTime || '';
  document.getElementById('editBreak').value = String(d.breakMin || 0);
  document.getElementById('editLeave').value = d.leave || '';
  const rawEl = document.getElementById('editRaw');
  if (d.rawIn || d.rawOut) {
    rawEl.textContent = '打刻した時刻：' + (d.rawIn ? '出社 ' + d.rawIn : '') + (d.rawIn && d.rawOut ? ' / ' : '') + (d.rawOut ? '退社 ' + d.rawOut : '');
  } else {
    rawEl.textContent = '';
  }
  const del = document.getElementById('btnDelete');
  del.classList.remove('armed'); del.textContent = 'この日の記録を削除';
  showEditMsg('');
  showView('viewEdit');
}
document.getElementById('btnEdit').addEventListener('click', function(){
  if (!state) return;
  const rec = state.record;
  openEdit({ date: state.date, inTime: rec.inTime, outTime: rec.outTime, breakMin: rec.breakMin, leave: rec.leave, rawIn: rec.rawIn, rawOut: rec.rawOut });
});
document.getElementById('btnSaveEdit').addEventListener('click', async function(){
  try {
    const leave = document.getElementById('editLeave').value;
    await api('saveEdit', { payload: JSON.stringify({
      date: editDate,
      inTime: document.getElementById('editIn').value,
      outTime: document.getElementById('editOut').value,
      breakMin: Number(document.getElementById('editBreak').value),
      leave: leave
    })});
    state = await api('getStatus');
    render();
    showView('viewPunch');
    showMsg('保存しました', true);
  } catch (e) { showEditMsg(e.message, false); }
});
document.getElementById('btnDelete').addEventListener('click', async function(){
  const del = document.getElementById('btnDelete');
  if (!del.classList.contains('armed')) {
    del.classList.add('armed'); del.textContent = '本当に削除しますか？（もう一度タップ）';
    return;
  }
  try {
    await api('deleteRecord', { date: editDate });
    state = await api('getStatus');
    render();
    showView('viewPunch');
    showMsg('削除しました', true);
  } catch (e) { showEditMsg(e.message, false); }
});

/* 起動 */
(async function init(){
  try {
    await liff.init({ liffId: LIFF_ID });
    if (!liff.isLoggedIn()) { liff.login(); return; }
    idToken = liff.getIDToken();
    const profile = await liff.getProfile();
    myName = profile.displayName || '';
    state = await api('getStatus');
    render();
  } catch (e) {
    document.getElementById('loading').textContent = '開き直してください：' + e.message;
  }
})();
</script>
</body>
</html>
